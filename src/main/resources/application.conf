ktor {
    application {
        modules = [ web.ApplicationKt.module ]
    }

    deployment {
        port = 8080
    }
}

storage {
    driverClassName = "org.postgresql.Driver"
    jdbcURL = "jdbc:postgresql://localhost:5432/tictactoe_db"
    user = "postgres"
    password = "1234"
}

jwt {
    audience = "http://localhost:8080"
    issuer = "http://localhost:8080"
    realm = "Access protected routes"
    secret = ${SECRET}
    accessTokenValidity = 3600000
    refreshTokenValidity = 86400000
}